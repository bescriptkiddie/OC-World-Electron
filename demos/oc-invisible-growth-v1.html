<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OC World 1.0 · 隐形成长系统</title>
    <style>
      :root {
        --bg: #eff3f0;
        --paper: #fbfcf8;
        --panel: #f4f7f1;
        --ink: #202622;
        --muted: #69736d;
        --faint: #929c96;
        --line: rgba(32, 38, 34, 0.13);
        --line-strong: rgba(32, 38, 34, 0.25);
        --green: #147866;
        --green-soft: #dcefe8;
        --blue: #315fa7;
        --blue-soft: #dfe9fb;
        --gold: #93691f;
        --gold-soft: #f3e6c9;
        --shadow: 0 28px 78px -58px rgba(24, 30, 27, 0.72);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        min-width: 1120px;
        color: var(--ink);
        background:
          linear-gradient(rgba(32, 38, 34, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(32, 38, 34, 0.04) 1px, transparent 1px),
          var(--bg);
        background-size: 24px 24px;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .app {
        width: 100%;
        height: 100%;
        padding: 24px;
        display: grid;
        grid-template-columns: 318px minmax(0, 1fr);
        gap: 16px;
      }

      .companion,
      .chat,
      .memory-drawer,
      .toast {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(251, 252, 248, 0.96);
        box-shadow: var(--shadow);
      }

      .companion,
      .chat {
        min-height: 0;
        overflow: hidden;
      }

      .companion {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
      }

      .titlebar,
      .chat-head,
      .drawer-head {
        min-height: 52px;
        padding: 13px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line);
      }

      .traffic {
        display: flex;
        gap: 7px;
      }

      .traffic span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      .traffic span:nth-child(1) {
        background: #ed6a5e;
      }

      .traffic span:nth-child(2) {
        background: #f4bd4f;
      }

      .traffic span:nth-child(3) {
        background: #61c454;
      }

      .kicker {
        color: var(--faint);
        font-size: 11px;
        text-transform: uppercase;
      }

      .companion-main {
        min-height: 0;
        padding: 16px;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 14px;
      }

      .brand,
      .state-row,
      .quiet-line,
      .drawer-card-head,
      .signal-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .brand {
        justify-content: flex-start;
        font-weight: 800;
      }

      .mark {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
      }

      .state,
      .pill {
        min-height: 24px;
        padding: 4px 9px;
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper);
        color: var(--muted);
        font-size: 12px;
      }

      .state::before {
        content: "";
        width: 7px;
        height: 7px;
        margin-right: 6px;
        border-radius: 50%;
        background: #58b765;
      }

      .avatar-wrap {
        min-height: 300px;
        display: grid;
        place-items: center;
      }

      .avatar {
        position: relative;
        width: 168px;
        height: 214px;
        display: grid;
        place-items: end center;
      }

      .avatar::after {
        content: "";
        position: absolute;
        bottom: 2px;
        left: 50%;
        width: 132px;
        height: 20px;
        border-radius: 50%;
        background: rgba(32, 38, 34, 0.12);
        filter: blur(7px);
        transform: translateX(-50%);
      }

      .avatar img {
        position: relative;
        z-index: 1;
        width: 154px;
      }

      .quiet-panel,
      .whisper,
      .drawer-card,
      .empty-signal {
        padding: 13px;
        display: grid;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel);
      }

      .quiet-panel h2,
      .whisper h3,
      .drawer-card h3,
      .empty-signal h3 {
        margin: 0;
        font-size: 15px;
      }

      .quiet-panel p,
      .whisper p,
      .drawer-card p,
      .empty-signal p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .quiet-line span {
        color: var(--faint);
        font-size: 11px;
      }

      .companion-actions {
        padding: 14px 16px 16px;
        display: grid;
        gap: 8px;
        border-top: 1px solid var(--line);
      }

      .btn {
        min-height: 38px;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        cursor: pointer;
      }

      .btn:hover {
        border-color: var(--line-strong);
        background: #ffffff;
      }

      .btn.primary {
        border-color: rgba(20, 120, 102, 0.28);
        background: var(--green);
        color: white;
      }

      .btn.blue {
        border-color: rgba(49, 95, 167, 0.25);
        background: var(--blue-soft);
        color: var(--blue);
      }

      .btn.ghost {
        color: var(--muted);
      }

      .chat {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
      }

      .chat-head h1,
      .drawer-head h2 {
        margin: 0;
        font-size: 20px;
        line-height: 1.1;
      }

      .chat-head p,
      .drawer-head p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .head-actions {
        display: flex;
        gap: 8px;
      }

      .messages {
        min-height: 0;
        padding: 24px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .time-chip {
        align-self: center;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(251, 252, 248, 0.76);
        color: var(--faint);
        font-size: 12px;
      }

      .message {
        max-width: 72%;
        display: grid;
        gap: 5px;
      }

      .message.user {
        align-self: flex-end;
        justify-items: end;
      }

      .message.oc {
        align-self: flex-start;
      }

      .bubble {
        padding: 13px 15px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--paper);
        font-size: 14px;
        line-height: 1.58;
      }

      .message.user .bubble {
        border-color: rgba(20, 120, 102, 0.28);
        background: var(--green);
        color: white;
      }

      .meta {
        color: var(--faint);
        font-size: 11px;
      }

      .soft-discovery {
        align-self: stretch;
        padding: 12px;
        display: grid;
        gap: 10px;
        border: 1px solid rgba(147, 105, 31, 0.24);
        border-radius: 9px;
        background: var(--gold-soft);
      }

      .soft-discovery p {
        margin: 0;
        color: #65491c;
        font-size: 13px;
        line-height: 1.55;
      }

      .discovery-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .discovery-actions .btn {
        min-height: 32px;
        background: rgba(251, 252, 248, 0.86);
        font-size: 12px;
      }

      .system-note {
        align-self: stretch;
        padding: 9px 12px;
        border: 1px solid rgba(20, 120, 102, 0.18);
        border-radius: 9px;
        background: var(--green-soft);
        color: #245b53;
        font-size: 12px;
      }

      .composer {
        padding: 14px 18px 18px;
        display: grid;
        gap: 10px;
        border-top: 1px solid var(--line);
      }

      .prompts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .prompt {
        min-height: 30px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
      }

      .prompt:hover {
        color: var(--ink);
        border-color: var(--line-strong);
      }

      .input-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      .input-box {
        min-height: 50px;
        padding: 0 14px;
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 11px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--paper);
      }

      .plus {
        color: var(--muted);
        font-size: 22px;
      }

      input {
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
      }

      .memory-drawer {
        position: fixed;
        top: 24px;
        right: 24px;
        bottom: 24px;
        width: 430px;
        z-index: 20;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        overflow: hidden;
        transform: translateX(calc(100% + 36px));
        transition: transform 220ms ease;
      }

      .memory-drawer.is-open {
        transform: translateX(0);
      }

      .drawer-body {
        min-height: 0;
        padding: 14px;
        overflow: auto;
        display: grid;
        align-content: start;
        gap: 10px;
      }

      .drawer-card {
        background: var(--paper);
      }

      .drawer-card-head b {
        font-size: 13px;
      }

      .signal-row {
        padding-top: 4px;
        color: var(--faint);
        font-size: 11px;
      }

      .signal-tag {
        width: fit-content;
        padding: 4px 8px;
        border: 1px solid rgba(20, 120, 102, 0.18);
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--green);
        font-size: 11px;
        font-weight: 800;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        padding: 12px 16px;
        z-index: 30;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 10px);
        transition:
          opacity 180ms ease,
          transform 180ms ease;
      }

      .toast.is-visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (max-width: 920px) {
        body {
          min-width: 0;
        }

        .app {
          height: auto;
          min-height: 100%;
          padding: 14px;
          grid-template-columns: 1fr;
        }

        .companion,
        .chat {
          min-height: 560px;
        }

        .memory-drawer {
          left: 14px;
          right: 14px;
          top: 14px;
          bottom: 14px;
          width: auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <aside class="companion">
        <div class="titlebar">
          <div class="traffic" aria-hidden="true"><span></span><span></span><span></span></div>
          <span class="kicker">quiet growth</span>
        </div>

        <div class="companion-main">
          <div class="state-row">
            <div class="brand"><span class="mark">⌘</span><span>OC World</span></div>
            <span class="state" id="stateText">在听</span>
          </div>

          <div class="avatar-wrap">
            <div class="avatar"><img src="./oc-avatar-pet.png" alt="OC 成长伙伴形象" /></div>
          </div>

          <section class="quiet-panel">
            <div class="quiet-line">
              <h2 id="quietTitle">Luma 正在学会你</h2>
              <span id="quietCount">正在听</span>
            </div>
            <p id="quietText">第一版不让你管理系统。你只需要说话，OC 会在背后慢慢整理目标、优势、证据和下一步。</p>
          </section>
        </div>

        <div class="companion-actions">
          <button class="btn" type="button" id="focusInput">和 Luma 说话</button>
          <button class="btn blue" type="button" id="softOpen">看看它发现了什么</button>
        </div>
      </aside>

      <section class="chat">
        <header class="chat-head">
          <div>
            <h1>先对话，系统在背后长出来</h1>
            <p>一开始不展示人生系统。OC 先陪伴、记住、理解，再等待你探索。</p>
          </div>
          <div class="head-actions">
            <button class="btn blue" type="button" id="runDemo">播放隐形闭环</button>
            <button class="btn ghost" type="button" id="openMemory">探索</button>
          </div>
        </header>

        <div class="messages" id="messages"></div>

        <div class="composer">
          <div class="prompts" id="prompts"></div>
          <div class="input-row">
            <label class="input-box">
              <span class="plus">＋</span>
              <input id="input" value="我感觉第一版不应该把成长系统都展示出来。" />
            </label>
            <button class="btn primary" type="button" id="send">发送</button>
          </div>
        </div>
      </section>
    </main>

    <aside class="memory-drawer" id="memoryDrawer" aria-label="Luma 正在学会你的内容">
      <div class="drawer-head">
        <div>
          <h2>Luma 正在学会你</h2>
          <p>这些不是第一屏功能，是慢慢被发现的成长系统。</p>
        </div>
        <button class="btn" type="button" id="closeMemory">关闭</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>

    <div class="toast" id="toast">已默默记住</div>

    <script>
      const $ = (id) => document.getElementById(id);
      const esc = (text) =>
        String(text).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[m]);

      const prompts = ["我今天在想", "我有点卡住", "你觉得你懂我吗", "我们可以沉淀什么"];
      const runtime = window.ocWorld;
      const defaultUserId = "user-001";
      const defaultCharacterId = "char-001";

      const state = {
        isSending: false,
        unlocked: false,
        signals: [],
        messages: [
          { type: "time", text: "今天 23:08" },
          {
            type: "oc",
            text: "你不用先打开什么系统。你只要跟我说今天发生了什么，我会先陪你把它讲清楚。",
            meta: "Luma · 成长伙伴",
          },
        ],
        memory: {
          target: {
            title: "可能的长期目标",
            text: "你在找的不是一个工具，而是一种人和 AI 长期共同成长的关系。",
            status: "等待更多证据",
            tag: "目标图谱",
          },
          strength: {
            title: "反复出现的优势",
            text: "你很擅长从“不对劲的感觉”里提出更准确的产品定义。",
            status: "已出现 3 次",
            tag: "优势画像",
          },
          evidence: {
            title: "最近的成长证据",
            text: "你连续校准了三个方向：不是任务代理、不是桌宠、不是把系统全展示出来。",
            status: "默默记录",
            tag: "成长证据",
          },
          plan: {
            title: "下一步规划",
            text: "先验证一个最小动作：用户是否愿意每天和 OC 说一件真实经历。",
            status: "适合现在",
            tag: "规划建议",
          },
        },
      };

      function toast(text) {
        $("toast").textContent = text;
        $("toast").classList.add("is-visible");
        window.clearTimeout(toast.timer);
        toast.timer = window.setTimeout(() => $("toast").classList.remove("is-visible"), 1500);
      }

      function remember(signal) {
        if (!state.signals.includes(signal)) state.signals.push(signal);
        $("quietCount").textContent = `${state.signals.length} 个线索`;
        $("stateText").textContent = state.signals.length >= 3 ? "更懂你了" : "在听";
      }

      function setSending(isSending) {
        state.isSending = isSending;
        $("send").disabled = isSending;
        $("input").disabled = isSending;
        $("stateText").textContent = isSending ? "在想" : state.signals.length >= 3 ? "更懂你了" : "在听";
        $("send").textContent = isSending ? "思考中" : "发送";
      }

      function inferReply(text) {
        if (text.includes("不应该") || text.includes("展示")) {
          remember("evidence");
          remember("plan");
          return "对。第一版不应该让用户看到一堆成长系统。系统应该先在背后工作，你只感受到我越来越懂你。";
        }
        if (text.includes("卡住")) {
          remember("plan");
          return "我先不急着给你一个方案。我想确认：你现在卡住的是功能怎么收，还是第一版到底要验证什么？";
        }
        if (text.includes("懂我")) {
          remember("target");
          remember("strength");
          return "我现在只看见一点：你一直在找的是“人和 AI 的长期关系”，不是一个短期效率工具。这个判断对吗？";
        }
        if (text.includes("沉淀")) {
          remember("target");
          return "可以沉淀，但不要太早展示。先让沉淀发生在后台，等它足够准确时，我再轻轻问你要不要看看。";
        }
        remember("evidence");
        return "我先把这句话记成一个线索，不急着给它命名。等类似的线索多一点，我再帮你看它可能指向什么。";
      }

      function discoveryText() {
        return "我好像开始看见一个线索：你不是想做一个管理人生的仪表盘，而是在做一个会慢慢理解人的成长伙伴。要不要看看我目前发现了什么？";
      }

      function addDiscoveryIfReady() {
        if (state.signals.length >= 2) {
          state.messages.push({ type: "discovery", text: discoveryText() });
          $("quietTitle").textContent = "Luma 发现了一点东西";
          $("quietText").textContent = "它还没有急着变成系统，只是在等待你决定要不要探索。";
        } else {
          $("quietTitle").textContent = "Luma 默默记住了";
          $("quietText").textContent = "这些线索会先留在后台，不会马上变成指标或任务。";
        }
      }

      function renderMessages() {
        $("messages").innerHTML = state.messages
          .map((msg) => {
            if (msg.type === "time") return `<div class="time-chip">${esc(msg.text)}</div>`;
            if (msg.type === "note") return `<div class="system-note">${esc(msg.text)}</div>`;
            if (msg.type === "discovery") {
              return `
                <div class="soft-discovery">
                  <p>${esc(msg.text)}</p>
                  <div class="discovery-actions">
                    <button class="btn primary" type="button" data-discover="open">看看你发现了什么</button>
                    <button class="btn" type="button" data-discover="later">先不用展开</button>
                  </div>
                </div>
              `;
            }
            return `
              <div class="message ${msg.type}">
                <div class="bubble">${esc(msg.text)}</div>
                <div class="meta">${esc(msg.meta)}</div>
              </div>
            `;
          })
          .join("");
        document.querySelectorAll("[data-discover]").forEach((button) => {
          button.addEventListener("click", () => {
            if (button.dataset.discover === "open") openMemory();
            if (button.dataset.discover === "later") {
              state.messages.push({ type: "note", text: "Luma 会先继续默默观察，不打断当前对话。" });
              renderMessages();
              toast("继续在后台学习");
            }
          });
        });
        $("messages").scrollTop = $("messages").scrollHeight;
      }

      function renderPrompts() {
        $("prompts").innerHTML = prompts.map((item) => `<button class="prompt" type="button" data-prompt="${esc(item)}">${esc(item)}</button>`).join("");
        document.querySelectorAll("[data-prompt]").forEach((button) => {
          button.addEventListener("click", () => {
            const map = {
              我今天在想: "我感觉第一版不应该把成长系统都展示出来。",
              我有点卡住: "我有点卡住，不确定第一版应该验证什么。",
              你觉得你懂我吗: "你觉得你现在有一点懂我了吗？",
              我们可以沉淀什么: "如果不展示系统，我们可以先沉淀什么？",
            };
            $("input").value = map[button.dataset.prompt] || button.dataset.prompt;
            $("input").focus();
          });
        });
      }

      function renderMemory() {
        const keys = state.signals.length ? state.signals : [];
        $("drawerBody").innerHTML = keys.length
          ? keys
              .map((key) => {
                const item = state.memory[key];
                return `
                  <section class="drawer-card">
                    <div class="drawer-card-head"><b>${esc(item.title)}</b><span class="signal-tag">${esc(item.tag)}</span></div>
                    <p>${esc(item.text)}</p>
                    <div class="signal-row"><span>${esc(item.status)}</span><span>可继续校准</span></div>
                  </section>
                `;
              })
              .join("")
          : `
            <section class="empty-signal">
              <h3>还没有足够线索</h3>
              <p>OC 不会太早给你贴标签。先聊几次，让目标和优势自然浮现。</p>
            </section>
          `;
      }

      function openMemory() {
        state.unlocked = true;
        renderMemory();
        $("memoryDrawer").classList.add("is-open");
        toast("你探索到了后台线索");
      }

      async function callOcWorldChat(text) {
        if (!runtime?.chat?.sendMessage) {
          return null;
        }

        const response = await runtime.chat.sendMessage({
          userId: defaultUserId,
          characterId: defaultCharacterId,
          userMessage: text,
          interrupt: true,
        });

        return response?.text?.trim() ? response.text.trim() : null;
      }

      async function sendMessage(text = $("input").value.trim()) {
        if (state.isSending) return;
        if (!text) return;
        const fallbackReply = inferReply(text);
        state.messages.push({ type: "user", text, meta: "你" });
        $("input").value = "我再补充一点。";
        renderMessages();
        toast("已默默记住");

        setSending(true);

        let reply = fallbackReply;
        let usedRemote = false;
        try {
          const remoteReply = await callOcWorldChat(text);
          if (remoteReply) {
            reply = remoteReply;
            usedRemote = true;
          }
        } catch {
          reply = fallbackReply;
          toast("模型暂时不可用，先用本地回应");
        } finally {
          setSending(false);
        }

        state.messages.push({ type: "oc", text: reply, meta: usedRemote ? "Luma · MiMo 驱动" : "Luma · 本地演示" });
        addDiscoveryIfReady();
        renderMessages();
      }

      async function runDemo() {
        $("input").value = "我感觉第一版不应该把成长系统都展示出来。";
        await sendMessage();
        await new Promise((resolve) => window.setTimeout(resolve, 300));
        $("input").value = "你觉得你现在有一点懂我了吗？";
        await sendMessage();
        await new Promise((resolve) => window.setTimeout(resolve, 300));
        openMemory();
      }

      $("send").addEventListener("click", () => void sendMessage());
      $("input").addEventListener("keydown", (event) => {
        if (event.key === "Enter") void sendMessage();
      });
      $("focusInput").addEventListener("click", () => $("input").focus());
      $("softOpen").addEventListener("click", openMemory);
      $("openMemory").addEventListener("click", openMemory);
      $("closeMemory").addEventListener("click", () => $("memoryDrawer").classList.remove("is-open"));
      $("runDemo").addEventListener("click", runDemo);

      renderPrompts();
      renderMessages();
      renderMemory();
    </script>
  </body>
</html>
